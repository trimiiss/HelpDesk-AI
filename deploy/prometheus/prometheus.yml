global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: helpdesk
    static_configs:
      - targets:
          - call-gateway:9464
          - knowledge-service:9464
          - call-worker:9464

  - job_name: nats
    static_configs:
      - targets:
          - nats-exporter:7777
